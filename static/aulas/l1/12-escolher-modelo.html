<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L1 · 12 · Escolhendo o modelo certo</title>
<style>
/* Guided lesson shell. Replace the tokens per subject; keep the hierarchy:
   progress → title → scene → one narration line + one primary action. */
:root {
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --bg:#f6f5f1;
  --surface:#fff;
  --ink:#14161b;
  --muted:#6b6f78;
  --faint:#a3a6ad;
  --line:#e6e3dc;
  --accent:#3b5bdb;
  --accent-soft:#e9edff;
  --accent-ink:#2a44b8;
  --warm:#f59f00;
  --warm-soft:#fff3d6;
  --good:#0c8a5f;
  --good-soft:#e3f6ee;
  --bad:#d9480f;
  --bad-soft:#fdebe2;
  --radius:20px;
  font-family:var(--font);
  color:var(--ink);
  background:var(--bg);
  font-feature-settings:'cv11','ss01';
  -webkit-font-smoothing:antialiased
}
* { box-sizing:border-box }
html,body { margin:0; height:100% }
body { background:var(--bg) }
button,input,select,textarea { font:inherit; color:inherit }
button { cursor:pointer }
button:disabled { cursor:default }
:focus-visible { outline:3px solid var(--accent); outline-offset:3px; border-radius:8px }

.lp { display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr) auto; height:100dvh; max-width:1360px; margin:0 auto; padding:0 clamp(16px,3vw,44px) }
.lp-top { display:flex; align-items:center; gap:24px; height:64px }
.lp-course { margin:0; font-size:14px; font-weight:600; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:30%}
.lp-progress { flex:1; display:flex; gap:4px }
.lp-progress button { flex:1; background:none; border:0; padding:12px 0 }
.lp-progress span { display:block; height:5px; border-radius:99px; background:var(--line) }
.lp-progress .done span { background:color-mix(in srgb,var(--accent) 45%,var(--line)) }
.lp-progress [aria-current] span { background:var(--accent) }
.lp-progress button:hover span { background:var(--faint) }

.lp-stage { display:flex; flex-direction:column; min-height:0; padding-top:6px }
.lp-kicker { margin:0; font-size:13px; font-weight:650; letter-spacing:.12em; text-transform:uppercase; color:var(--accent) }
.lp-stage h1 { margin:6px 0 0; font-size:clamp(28px,3vw,42px); line-height:1.08; font-weight:720; letter-spacing:-.025em; max-width:30ch; text-wrap:balance }
.lp-scene { position:relative; flex:1; min-height:0; margin:18px 0 12px; background:var(--surface); border-radius:var(--radius); box-shadow:0 1px 2px rgba(20,22,27,.04),0 12px 40px rgba(20,22,27,.06); overflow:hidden; display:flex }
.lp-scene > * { flex:1; min-width:0 }
.lp-inputs { display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; margin:0 0 6px }
.lp-inputs[hidden] { display:none }
.lp-label { font-size:15px; font-weight:600; color:var(--muted) }
.lp-value { font:600 18px var(--mono); min-width:4ch; color:var(--ink) }
.lp-inputs input[type=range] { width:min(320px,60vw); accent-color:var(--accent) }
.lp-inputs select { padding:10px 12px; border:1.5px solid var(--line); border-radius:12px; background:var(--surface) }
.lp-choices { display:flex; flex-wrap:wrap; align-items:center; gap:10px }
.lp-choice { padding:11px 18px; border:1.5px solid var(--line); border-radius:14px; background:var(--surface); font-size:17px; font-weight:550 }
.lp-choice:hover { border-color:var(--faint) }
.lp-choice[aria-pressed=true] { border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink) }

.lp-bar { display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; align-items:center; gap:18px; padding:12px 0 18px; border-top:1px solid var(--line) }
.lp-narration p { margin:0; min-height:2.8em; display:flex; align-items:center; font-size:clamp(17px,1.45vw,21px); line-height:1.4; font-weight:520; text-wrap:pretty }
.lp-dots { display:flex; gap:6px; margin-top:4px; height:6px }
.lp-dots i { width:6px; height:6px; border-radius:99px; background:var(--line) }
.lp-dots .done { background:color-mix(in srgb,var(--accent) 45%,var(--line)) }
.lp-dots .now { width:20px; background:var(--accent) }
.lp-go { display:flex; flex-direction:column; align-items:center; gap:4px }
.lp-primary { min-width:170px; padding:15px 28px; border:0; border-radius:999px; background:var(--ink); color:#fff; font-size:17px; font-weight:650; box-shadow:0 6px 18px rgba(20,22,27,.18) }
/* No CSS transitions on anything the timeline or the capture touches: they would run outside seek. */
.lp-primary:hover:not(:disabled) { background:#000; transform:translateY(-1px) }
.lp-primary:disabled { background:var(--faint); box-shadow:none }
.lp-keys { font-size:12px; color:var(--faint) }
.lp-ghost { background:none; border:0; border-radius:10px; padding:10px 14px; font-size:15px; font-weight:550; color:var(--muted) }
.lp-ghost:hover:not(:disabled) { background:color-mix(in srgb,var(--line) 70%,transparent); color:var(--ink) }
.lp-ghost:disabled { opacity:.35 }
.lp-replay { font-size:22px; padding:6px 12px }
.lp-replay[hidden] { display:block; visibility:hidden }

.lp-drawer { position:fixed; inset:0 0 0 auto; width:min(440px,92vw); background:var(--surface); box-shadow:-20px 0 60px rgba(20,22,27,.15); padding:24px 28px; overflow:auto; z-index:10; font-size:15px; line-height:1.55 }
.lp-drawer[hidden] { display:none }
.lp-drawer-head { display:flex; justify-content:space-between; align-items:center }
.lp-drawer h2 { margin:0; font-size:20px }
.lp-drawer h3 { margin:22px 0 6px; font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted) }
.lp-drawer ul { margin:0; padding-left:18px }
.lp-drawer li { margin:8px 0 }
.lp-drawer a { color:var(--accent-ink) }
.lp-drawer p { margin:2px 0 0; color:var(--muted) }

/* Scene building blocks. A scene uses one of them; text inside stays short. */
.sc-split { display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:clamp(20px,3vw,48px); align-items:center; padding:clamp(20px,3vw,44px) }
.sc-center { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:18px; padding:clamp(20px,3vw,44px) }
.sc-full { display:flex; padding:clamp(12px,2vw,28px) }
.sc-full > svg, .sc-visual > svg { width:100%; height:100%; display:block }
.sc-visual { min-height:0; height:100%; display:flex; align-items:center }
.sc-say { margin:0; font-size:clamp(24px,2.3vw,34px); line-height:1.22; font-weight:650; letter-spacing:-.015em; text-wrap:balance }
.sc-sub { margin:14px 0 0; font-size:clamp(16px,1.3vw,19px); line-height:1.5; color:var(--muted); text-wrap:pretty }
/* Deeper explanation: body style, comfortable measure, same place on every screen that has one. */
.sc-read { margin:16px 0 0; font-size:clamp(16px,1.25vw,18px); line-height:1.65; color:var(--ink); max-width:62ch; text-wrap:pretty }
.sc-term { display:inline-block; padding:2px 10px; border-radius:8px; background:var(--accent-soft); color:var(--accent-ink); font-weight:650 }
.sc-big { font-size:clamp(56px,7vw,112px); line-height:1; font-weight:760; letter-spacing:-.04em; font-variant-numeric:tabular-nums }
.sc-label { font-size:14px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted) }
.sc-note { font-size:13px; color:var(--faint) }
.sc-feedback { margin:18px 0 0; padding:16px 18px; border-radius:14px; font-size:18px; line-height:1.5; background:var(--good-soft); color:#075c3f }
.sc-feedback.wrong { background:var(--bad-soft); color:#9a330a }
.lp svg text { font-family:var(--font) }
.sc-only-narrow { display:none!important }

/* Practice: the question and its answer cards form one group in the middle of the screen. */
.lp[data-kind=pratica] .lp-stage { justify-content:center }
.lp[data-kind=pratica] .lp-scene { flex:0 1 auto; min-height:260px }
.lp[data-kind=pratica] .lp-inputs { justify-content:center; margin:6px 0 24px }
.lp[data-kind=pratica] .lp-inputs .lp-label { display:none }
.lp[data-kind=pratica] .lp-choice { padding:16px 26px; font-size:19px }

/* kit.js blocks */
.sc-copy { max-width:44ch }
.sc-question { max-width:780px }
.sc-question .sc-say { font-size:clamp(26px,2.4vw,34px) }
.sc-cards { flex:1; display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:22px; padding:clamp(20px,3vw,44px); align-content:center }
.sc-card { padding:28px; border-radius:18px; background:var(--bg) }
.sc-card b { display:block; font-size:44px; margin-bottom:12px }
.sc-card p { margin:0; font-size:21px; line-height:1.35; font-weight:620 }
.sc-card span { display:block; margin-top:10px; font-size:16px; color:var(--muted) }
.mock-app { width:min(clamp(380px,40vw,600px),100%); font-size:clamp(16px,1.3vw,19px); border-radius:28px; background:var(--surface); border:1px solid var(--line); box-shadow:0 24px 60px rgba(20,22,27,.16); overflow:hidden; text-align:left }
.mock-app-bar { display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--line); font-size:16px }
.mock-app-bar em { font-style:normal; font-size:12px; font-weight:600; color:var(--muted); padding:2px 8px; border-radius:6px; background:var(--bg) }
.mock-app-body { padding:20px 22px 24px; display:flex; flex-direction:column; gap:14px }
.app-row { display:flex; justify-content:space-between; align-items:center; padding:clamp(14px,1.4vw,20px) 18px; border-radius:14px; background:var(--bg); font-size:inherit }
.app-row b { font:650 1.2em var(--font); font-variant-numeric:tabular-nums }
.app-row.on { background:var(--accent-soft); color:var(--accent-ink) }
.app-hero { padding:6px 4px 10px }
.app-hero span { display:block; color:var(--muted) }
.app-hero b { display:block; margin-top:6px; font-size:2.4em; font-weight:720; letter-spacing:-.02em; font-variant-numeric:tabular-nums }
.app-btn { padding:14px; border-radius:14px; background:var(--accent); color:#fff; text-align:center; font-weight:650 }
.app-toast { padding:12px 14px; border-radius:12px; background:var(--good-soft); color:#075c3f; font-weight:600 }

/* Realistic mock of a tool. Label it as a simulation inside the scene. */
/* A mock fills the scene: it is the evidence the screen is about, not a thumbnail. */
.mock { width:100%; max-width:1040px; border-radius:16px; overflow:hidden; background:#16181d; color:#e8e9ec; box-shadow:0 20px 50px rgba(20,22,27,.25); font:clamp(15px,1.35vw,20px)/1.6 var(--mono); text-align:left }
.mock-bar { display:flex; align-items:center; gap:8px; padding:12px 16px; background:#202329; font:600 13px var(--font); color:#9aa0aa }
.mock-bar i { width:12px; height:12px; border-radius:99px; background:#3a3e46 }
.mock-bar span { margin-left:10px }
.mock-bar em { margin-left:auto; font-style:normal; font-weight:500; padding:2px 8px; border-radius:6px; background:#2c3038 }
.mock pre { margin:0; padding:22px 26px; min-height:clamp(220px,38vh,420px); white-space:pre-wrap; font:inherit }
.mock .p { color:#7c8494 }
.mock .k { color:#8fb4ff }
.mock .s { color:#ffd479 }
.mock .ok { color:#5ee0a5 }
.mock .warn { color:#ff9f6e }
.mock .hl { background:rgba(255,212,121,.16); border-radius:4px; box-shadow:0 0 0 3px rgba(255,212,121,.16) }
.mock .cursor { display:inline-block; width:.6em; height:1.1em; vertical-align:-.15em; background:#e8e9ec }

@media (max-width:760px), (max-height:640px) {
  .lp { height:auto; min-height:100dvh; grid-template-rows:auto auto auto }
  .lp-course { display:none }
  .lp-scene { min-height:340px }
  .lp-bar { grid-template-columns:auto 1fr auto }
  .lp-narration { grid-column:1/-1; order:-1 }
  .lp-keys { display:none }
  .lp-primary { min-width:0 }
  .sc-split { grid-template-columns:1fr }
  .sc-only-wide { display:none!important }
  .sc-only-narrow { display:block!important }
  .sc-wide { overflow-x:auto }
  .sc-wide > svg { width:760px!important; height:auto!important; flex:none }
  .mock { font-size:13px }
}
@media (prefers-reduced-motion:reduce) { * { transition:none!important; scroll-behavior:auto!important } }

</style>

:root {
  /* Fontes */
  --font:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;
  /* Neutros (= tokens.css da plataforma, modo claro) */
  --bg:#f7f7f5; --surface:#ffffff; --fill-1:#f0f0ed; --fill-2:#e6e6e2;
  --ink:#17181b; --muted:#5e626b; --faint:#8c919a; --disabled:#a9adb4;
  --line:#e6e6e2; --divider:#17181b14; --border:#17181b1f;
  /* O único acento: ação, progresso e "o que está acontecendo agora" */
  --accent:#cc4a0a; --accent-hover:#b8420a; --accent-pressed:#a33a08; --accent-soft:#fdeee5; --accent-ink:#a33a08;
  --warm:#cc4a0a; --warm-soft:#fdeee5;            /* atenção = o mesmo laranja (um acento só) */
  /* Feedback (só em respostas de prática) */
  --good:#1f8f4e; --good-soft:#e6f4ec; --good-ink:#17703c;
  --bad:#c8333a; --bad-soft:#fbe9ea; --bad-ink:#a3252b;
  /* Segunda cor de diagrama: contexto / entrada (azul da fase 1). Só preenchimento e contorno, nunca texto. */
  --ctx:#3e7bfa; --ctx-soft:#e9f0ff; --ctx-line:#9dbcfc;
  /* O modelo (caixa preta do LLM) */
  --model:#17181b; --on-model:#ffffff;
  --radius:20px; --radius-card:14px; --radius-ctl:10px;
  font-feature-settings:normal;
}

/* ---------- Player com a cara da plataforma ---------- */
.lp-course { font:500 13px/1 var(--mono); letter-spacing:.04em; text-transform:uppercase; color:var(--muted) }
.lp-kicker { font:500 13px/1.2 var(--mono); letter-spacing:.06em; color:var(--accent-ink) }
.lp-stage h1 { font-weight:650; letter-spacing:-.02em }
.lp-scene { border:1px solid var(--divider); box-shadow:0 1px 3px #17181b0f,0 4px 16px #17181b0a }
.lp-narration p { font-weight:500 }
.lp-primary { border-radius:var(--radius-ctl); background:var(--accent); color:#fff; box-shadow:none; font-weight:600 }
.lp-primary:hover:not(:disabled) { background:var(--accent-hover); transform:none }
.lp-primary:active:not(:disabled) { background:var(--accent-pressed) }
.lp-primary:disabled { background:var(--fill-2); color:var(--disabled) }
.lp-ghost { border-radius:var(--radius-ctl) }
.lp-choice { border-radius:var(--radius-ctl); border-color:var(--border); font-weight:500 }
.lp-choice:hover { border-color:#17181b47 }
.lp-choice[aria-pressed=true] { border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink) }
.lp-label { font-weight:500 }
.lp-value { font:600 18px var(--mono) }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--radius-ctl) }
.lp-drawer a { color:var(--accent-ink) }
.lp-keys { font-family:var(--mono); font-size:12px }

/* ---------- Blocos da cena ---------- */
.sc-say { font-weight:600; letter-spacing:-.02em }
.sc-big { font-weight:650 }
.sc-term { border-radius:6px; padding:1px 8px; font-weight:600 }
.sc-read { line-height:1.6 }
.sc-feedback { border-radius:var(--radius-card); background:var(--good-soft); color:var(--good-ink) }
.sc-feedback.wrong { background:var(--bad-soft); color:var(--bad-ink) }
.sc-card { border-radius:var(--radius-card); background:var(--fill-1) }
.sc-card b { font:600 14px/1 var(--mono); letter-spacing:.06em; color:var(--accent-ink); margin-bottom:16px }
.mock { border-radius:var(--radius-card); background:#17181b; box-shadow:0 16px 48px #17181b29,0 2px 8px #17181b14 }
.mock-bar { background:#202227; font-family:var(--mono); font-weight:500 }
.mock .k { color:#a8c4ff }
.mock .s { color:#ff9a63 }
.mock .ok { color:#6fd497 }
.mock .hl { background:rgba(255,122,51,.2); box-shadow:0 0 0 3px rgba(255,122,51,.2) }
.mock-app { border-radius:var(--radius-xl,20px) }

/* ---------- Convenções de diagrama (SVG) ----------
   Ficha de token: .tk (contexto, azul) · .tk.new (previsto/escolhido agora, laranja) · .tk.dim (fora de foco)
   · .tk.end (token especial: fim) · texto da ficha .tkt (mono, tinta) e .tkt.new (laranja escuro).
   Modelo: .llm (caixa escura) + .llmt (texto branco). Barras: .bar (candidato) · .bar.on (escolhido) · .bar.rest (os outros).
   Rótulo: .lab (cinza, 1 tamanho por tela) · valor: .val (tinta, mono tabular). Fios: .wire / .wire.on. */
svg .tk { fill:var(--ctx-soft); stroke:var(--ctx); stroke-width:2 }
svg .tk.new { fill:var(--accent-soft); stroke:var(--accent); stroke-width:2.5 }
svg .tk.dim { fill:var(--fill-1); stroke:var(--line); stroke-width:2 }
svg .tk.end { fill:var(--model); stroke:var(--model) }
svg .tk.ghost { fill:none; stroke:var(--accent); stroke-width:2.5; stroke-dasharray:7 6 }
svg .tkt, .lp svg .tkt { font-family:var(--mono); font-weight:500; fill:var(--ink); text-anchor:middle; dominant-baseline:central }
svg .tkt.new { fill:var(--accent-ink); font-weight:600 }
svg .tkt.end { fill:var(--on-model) }
svg .llm { fill:var(--model) }
svg .llmt { fill:var(--on-model); font-weight:650; text-anchor:middle; dominant-baseline:central; letter-spacing:.02em }
svg .bar { fill:#b4b7bd }
svg .bar.on { fill:var(--accent) }
svg .bar.rest { fill:#d7d8d3 }
svg .bar-track { fill:var(--fill-1) }
svg .mono, .lp svg .mono { font-family:var(--mono) }
svg .lab { fill:var(--muted); font-weight:500; dominant-baseline:central }
svg .val, .lp svg .val { fill:var(--ink); font-family:var(--mono); font-weight:500; font-variant-numeric:tabular-nums; dominant-baseline:central }
svg .ink { fill:var(--ink); dominant-baseline:central }
svg .acc { fill:var(--accent-ink); font-weight:600; dominant-baseline:central }
svg .wire { stroke:var(--line); stroke-width:3; fill:none; stroke-linecap:round }
svg .wire.on { stroke:var(--accent) }
svg .panel { fill:var(--surface); stroke:var(--line); stroke-width:2 }
svg .panel.ctx { fill:#f6f9ff; stroke:var(--ctx-line) }

</style>
<style>
/* Aula L1·12. Tese: a ficha de candidatos (colunas = modelos, linhas = dimensões) e a esteira de seis passos.
   Cinza = candidatos; laranja = o que se olha/escolhe agora; azul = entrada (mensagem, prompt); caixa escura = modelo. */
.lp[data-kind=mock] .sc-center { justify-content:flex-start; padding-top:clamp(12px,3vh,36px) }
.lp[data-kind=mock] .mock { max-width:1120px; font-size:clamp(14px,1.1vw,17px) }
.lp[data-kind=mock] .mock pre { min-height:clamp(220px,40vh,440px); padding:18px 24px }
.lp[data-kind=pratica] .lp-stage { justify-content:flex-start; padding-top:clamp(4px,2vh,24px) }
.lp[data-kind=pratica] .sc-center { justify-content:flex-start; gap:14px; padding-top:clamp(16px,2.6vh,32px); padding-bottom:clamp(16px,2.6vh,32px) }
.lp[data-kind=pratica] .sc-feedback { font-size:17px }
.lp[data-kind=pratica] .sc-question .sc-say { font-size:clamp(22px,2vw,28px) }
.lp[data-kind=resumo] .sc-cards { grid-template-columns:repeat(2,minmax(0,1fr)); max-width:1080px; margin:0 auto; width:100% } .lp[data-kind=resumo] .sc-card { padding:30px 32px } .lp[data-kind=resumo] .sc-card p { font-size:26px } .lp[data-kind=resumo] .sc-card span { font-size:18px }
/* Tabela de preços reconstruída (tela 3). */
.ptab { width:min(860px,100%); border-radius:var(--radius-card); background:var(--surface); border:1px solid var(--border); box-shadow:0 16px 48px #17181b1f; overflow:hidden; text-align:left }
.ptab-bar { display:flex; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid var(--line); font:600 16px var(--font); color:var(--ink) }
.ptab-bar em { font:500 12px var(--mono); font-style:normal; color:var(--muted); padding:2px 8px; border-radius:6px; background:var(--fill-1) }
.ptab-head, .ptab-row { display:grid; grid-template-columns:7.5em minmax(0,1fr) 5.2em 5.2em 3.4em; align-items:center; gap:10px; padding:0 20px }
.ptab-head { padding-top:12px; padding-bottom:8px; font:500 14px var(--font); color:var(--muted) }
.ptab-head span:nth-child(n+3), .ptab-row span:nth-child(n+3) { text-align:right }
.ptab-row { padding-top:11px; padding-bottom:11px; border-top:1px solid var(--line); font:500 17px var(--mono); color:var(--ink); font-variant-numeric:tabular-nums }
.ptab-row span:first-child { font:500 15px var(--font); color:var(--muted) }
.ptab-row.cut { border-top:2px solid var(--fill-2) }
.ptab-row.big { font-weight:650 }
.ptab-row.on { background:var(--accent-soft); color:var(--accent-ink); font-weight:650 }
.ptab-row b { font:650 14px var(--mono); color:var(--accent-ink) }
/* Quadro curto acima de uma prática (tela 15). */
.mini-tab { width:min(420px,100%); display:grid; grid-template-columns:1fr 4em 4em; gap:6px 18px; text-align:left; padding:12px 18px; border-radius:var(--radius-card); background:var(--fill-1); font:500 17px/1.3 var(--mono); color:var(--ink) }
.mini-tab span:not(:nth-child(3n+1)) { text-align:right; font-variant-numeric:tabular-nums } .mini-tab span:nth-child(-n+3) { color:var(--muted); font-family:var(--font) }
@media (max-width:760px) {
  .lp[data-kind=mock] .sc-center { padding:10px } .lp[data-kind=mock] .mock { font-size:11.5px } .lp[data-kind=mock] .mock pre { padding:12px; min-height:220px }
  .lp[data-kind=resumo] .sc-cards { grid-template-columns:1fr; gap:12px; padding:14px } .lp[data-kind=resumo] .sc-card { padding:16px 18px } .lp[data-kind=resumo] .sc-card b { margin-bottom:8px } .lp[data-kind=resumo] .sc-card p { font-size:18px } .lp[data-kind=resumo] .sc-card span { font-size:15px }
  .lp[data-kind=pratica] .lp-choice { padding:11px 14px; font-size:15px } .lp[data-kind=pratica] .sc-question .sc-say { font-size:19px } .lp[data-kind=pratica] .sc-sub { font-size:15px }
  .lp[data-kind=pratica] .sc-feedback { font-size:15px; padding:12px 14px } .lp[data-kind=pratica] .sc-center { padding:14px; gap:10px }
  .mock-bar span { display:none } .mini-tab { font-size:14px; padding:10px 12px; gap:4px 12px }
  .sc-read { font-size:15px; margin-top:10px } .sc-split { gap:14px; padding:18px 16px }
  .ptab-bar { padding:10px 12px; font-size:14px } .ptab-head, .ptab-row { grid-template-columns:minmax(0,1fr) 4.2em 4.2em 2.6em; gap:6px; padding-left:12px; padding-right:12px }
  .ptab-head span:first-child, .ptab-row span:first-child { display:none } .ptab-row { font-size:13px; padding-top:8px; padding-bottom:8px } .ptab-head { font-size:12px } .ptab-row b { font-size:12px }
}

<script>
/* Pure motion helpers. No clocks, timers, DOM reads or hidden random state. */
(function (global) {
  'use strict';
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const linear = x => clamp(x);
  const easeInOutCubic = x => (x = clamp(x)) < .5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2;

  }
};
